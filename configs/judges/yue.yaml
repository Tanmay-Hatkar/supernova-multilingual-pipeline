# Judge and scoring configuration for Cantonese (yue).
#
# SCAFFOLDED, NOT RUN. This language has placeholder data only and has
# never been executed. It is marked `planned` in languages.yaml so runs
# and reliability probes skip it. The config exists so the folder shape
# is ready, not to imply this language is wired up.
#
# Before flipping this to active: add real data to data/yue/, pick and
# probe actual models (python reliability.py), and validate the judge
# (python validate_judge.py --language yue).

language_code: yue
language_name: Cantonese

task_model:
  provider: groq
  model: openai/gpt-oss-20b   # placeholder, not yet probed for this language

judge:
  provider: groq
  model: qwen/qwen3.8-27b   # placeholder; different family than the task model
  runs_per_example: 3
  # Cantonese is the case that most warrants a language-specific rubric —
  # checks for Mandarin grammar wearing Cantonese script, particle
  # correctness, register. Point this at a rubric file when written.
  rubric_extension: null

scoring_method: flat

companion_metric: chrf++

notes: >
  Placeholder configuration for a scaffolded, unrun language. Nothing
  here has been probed or validated.
