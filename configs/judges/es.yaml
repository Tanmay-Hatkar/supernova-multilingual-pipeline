# Judge and scoring configuration for Spanish (es).
#
# Starter configuration — the judge here has not yet been validated
# against human labels (run: python validate_judge.py --language es).
# Treat results as a mechanics check, not a quality verdict.

language_code: es
language_name: Spanish

task_model:
  provider: groq
  model: openai/gpt-oss-20b

# A different model family than the task model, on purpose: a model
# should not be the one grading its own family's output. This was
# briefly compromised while working around a token-budget conflict;
# lowering MAX_OUTPUT_TOKENS below the provider's per-minute ceiling
# resolved that conflict and let the separation be restored.
judge:
  provider: groq
  model: qwen/qwen3.8-27b
  runs_per_example: 3
  rubric_extension: null

# The model GEPA uses to rewrite prompts. It reads a failing example plus
# the judge's written feedback and proposes a better instruction, which is
# a harder job than the translation itself — so it gets a stronger model
# than the task model rather than silently inheriting it. Omit this key to
# fall back to the task model.
reflection_model:
  provider: groq
  model: openai/gpt-oss-120b

# Deterministic checks on the output, run before the judge sees it.
# not_empty and not_source_copy are universal and run regardless. The
# script and variety checks are Chinese-specific and deliberately absent
# here: Spanish shares Latin script with English, so a residual-Latin
# check would flag every correct translation. Which checks apply is a
# property of the target language, which is why this list lives in the
# language config rather than in the pipeline.
output_checks: []

scoring_method: flat   # run `python run.py compare --language es` to see
                        # what severity weighting does to the spread

companion_metric: chrf++

notes: >
  Task model and judge are deliberately from different families. Judge
  is unvalidated until validate_judge.py reports a pass against
  human-labeled calibration examples.
