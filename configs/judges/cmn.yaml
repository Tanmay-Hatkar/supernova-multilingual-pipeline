# Judge and scoring configuration for Mandarin (cmn).
#
# Starter configuration — judge not yet validated against human labels
# (run: python validate_judge.py --language cmn).

language_code: cmn
language_name: Mandarin

task_model:
  provider: groq
  model: openai/gpt-oss-20b

# Single judge. The pipeline also accepts a multi-judge form, where
# several judges score every example and the median is taken:
#
#   judges:
#     - {provider: groq, model: qwen/qwen3.8-27b, runs_per_example: 3}
#     - {provider: groq, model: openai/gpt-oss-120b, runs_per_example: 3}
#
# Median rather than mean, so one judge failing badly on an example
# can't drag the verdict with it. Kept to a single judge here because
# every added judge multiplies API calls against a rate-limited tier —
# worth enabling deliberately, not by default.
judge:
  provider: groq
  model: qwen/qwen3.8-27b
  runs_per_example: 3
  rubric_extension: null

# The model GEPA uses to rewrite prompts. Stronger than the task model on
# purpose: proposing a better instruction from a failure and its feedback
# is harder than the translation itself. Omit to fall back to the task model.
reflection_model:
  provider: groq
  model: openai/gpt-oss-120b

# Deterministic checks on the output, run before the judge ever sees it.
# These catch what a semantic judge misses: in the pod's real evaluation
# an untranslated output and a fully-Traditional one were both scored ten
# out of ten, and both are caught here by a string comparison.
#
# not_empty and not_source_copy run for every language and don't need
# listing. The three below are specific to Mandarin as a target.
output_checks:
  - simplified_script       # Traditional characters in a Simplified target
  - no_cantonese_markers    # vernacular Cantonese written in Chinese characters
  - no_residual_latin       # English words left inside otherwise-Chinese output

scoring_method: flat

companion_metric: chrf++

notes: >
  Task model and judge are from different families on purpose. Judge is
  unvalidated until validate_judge.py reports a pass.
