name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # No API key is configured here on purpose: the suite must not
      # depend on the network. A test that needs a live model is a test
      # that will fail for reasons unrelated to the change under review.
      - name: Tests
        run: python -m pytest
