[project]
name = "supernova-multilingual-pipeline"
version = "0.1.0"
description = "Reference prompt-optimization pipeline for machine translation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# gepa/ is the import root: its modules import each other by bare name,
# so pytest adds it to sys.path rather than every test file doing it.
pythonpath = ["gepa"]
testpaths = ["gepa/tests"]
addopts = "-q"
filterwarnings = [
    # DSPy emits these from its own optimizers at import time.
    "ignore::DeprecationWarning:dspy.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Long explanatory comments are deliberate here: several of them
    # record why a measurement came out the way it did, which is the
    # part most likely to be lost otherwise.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests import after a sys.path insert where pytest config isn't used.
"gepa/tests/*" = ["E402"]
